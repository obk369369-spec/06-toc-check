<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TOC 정리 (저장소 사용 안함)</title>
  <style>
    :root { --bd:#d0d0d0; --bg:#fafafa; --fg:#111; --muted:#666; }
    *{ box-sizing:border-box; }
    body{ margin:12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; color:var(--fg); }
    h1{ font-size:18px; margin:0 0 10px 0; }
    .topbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    .btn{
      padding:6px 10px; border:1px solid var(--bd); background:#fff; border-radius:8px;
      cursor:pointer; user-select:none; font-size:12px;
    }
    .btn:active{ transform: translateY(1px); }
    .pill{
      padding:6px 10px; border:1px solid var(--bd); background:var(--bg);
      border-radius:999px; font-size:12px; color:var(--muted);
    }
    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .panel{ border:1px solid var(--bd); border-radius:10px; overflow:hidden; background:#fff; }
    .panelhead{
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 10px; background:var(--bg); border-bottom:1px solid var(--bd);
      font-size:12px; color:#222;
    }
    .panelhead .right{ display:flex; gap:6px; align-items:center; }
    textarea{
      width:100%; height:260px; border:0; outline:none; resize:vertical;
      padding:10px; font-size:12px; line-height:1.35; white-space:pre; overflow:auto;
    }
    .history{
      margin-top:10px; border:1px solid var(--bd); border-radius:10px; overflow:hidden; background:#fff;
    }
    .historyhead{
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 10px; background:var(--bg); border-bottom:1px solid var(--bd);
      font-size:12px;
    }
    .historytools{ display:flex; gap:6px; align-items:center; }
    .log{
      max-height:320px; overflow:auto; padding:10px; font-size:12px; line-height:1.35; white-space:pre-wrap;
    }
    .log .entry{ border:1px solid var(--bd); border-radius:10px; padding:8px; margin-bottom:8px; background:#fff; }
    .log .meta{ color:#333; margin-bottom:6px; }
    .log .label{ color:var(--muted); }
    .hint{ font-size:12px; color:var(--muted); margin-top:8px; }
    @media (max-width: 900px){
      .grid{ grid-template-columns: 1fr; }
      textarea{ height:220px; }
    }
  </style>
</head>
<body>
  <h1>TOC 정리 (저장소 사용 안함)</h1>

  <div class="topbar">
    <button class="btn" id="btnRun">정리</button>
    <button class="btn" id="btnClearIn">입력 지우기</button>
    <button class="btn" id="btnClearOut">출력 지우기</button>
    <button class="btn" id="btnCopyOut">출력 복사</button>

    <span class="pill" id="pillResidual">Residual State: 0</span>
    <span class="pill" id="pillStorage">storage-read: OFF / storage-write: OFF</span>
    <span class="pill" id="pillDone">DONE</span>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panelhead">
        <div>입력 (원문 TOC)</div>
        <div class="right">
          <button class="btn" id="btnTopIn">▲ 위로</button>
        </div>
      </div>
      <textarea id="taIn" spellcheck="false" placeholder="여기에 목차를 붙여넣기"></textarea>
    </div>

    <div class="panel">
      <div class="panelhead">
        <div>출력 (정리 결과)</div>
        <div class="right">
          <button class="btn" id="btnTopOut">▲ 위로</button>
        </div>
      </div>
      <textarea id="taOut" spellcheck="false" placeholder="정리 결과가 여기 표시됨" readonly></textarea>
    </div>
  </div>

  <div class="history">
    <div class="historyhead">
      <div>이력 (화면 전용 · 저장 안함)</div>
      <div class="historytools">
        <button class="btn" id="btnPass">PASS</button>
        <button class="btn" id="btnFail">X</button>
        <button class="btn" id="btnClearLog">이력 화면만 지우기</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="hint">※ 이 파일은 localStorage / sessionStorage / indexedDB 등을 읽거나 쓰지 않습니다. (화면을 닫으면 이력은 사라짐)</div>

<script>
(() => {
  // ====== 저장소 완전 차단(의도적으로 접근 자체를 안함) ======
  const STORAGE_READ_WRITE_OFF = true; // 표시용

  // ====== DOM ======
  const taIn  = document.getElementById('taIn');
  const taOut = document.getElementById('taOut');
  const logEl = document.getElementById('log');

  const pillResidual = document.getElementById('pillResidual');
  const pillStorage  = document.getElementById('pillStorage');
  const pillDone     = document.getElementById('pillDone');

  // ====== 상태(화면 전용) ======
  let residualState = 0; // 디버그/표시용 (저장 안함)
  let lastRun = { input:"", output:"" };

  function nowStamp(){
    const d = new Date();
    const pad = (n)=> String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function setPills(){
    pillResidual.textContent = `Residual State: ${residualState}`;
    pillStorage.textContent  = STORAGE_READ_WRITE_OFF ? `storage-read: OFF / storage-write: OFF` : `storage: ?`;
    pillDone.textContent     = `DONE`;
  }
  setPills();

  // ====== (1단계) 로직: 하하위 제거 + 페이지번호 제거 + 라인 정리 ======
  // 규칙:
  // - 빈줄 제거
  // - 글머리(-, •)로 시작하면 제거(본문 설명/메모로 간주)
  // - 끝의 페이지 숫자 제거 (예: "... 34", "... 34  " )
  // - 번호 깊이:
  //   * "5.2" => depth=2 (유지)
  //   * "1.3.1" => depth=3 (제거)
  //   * "1 INTRODUCTION" 같은 단일 숫자 토큰은 제목만 남김
  // - "Chapter 1." / "SECTION I:" 같은 라인은 유지(depth=0)
  function cleanLine(raw){
    let s = raw.replace(/\u00A0/g, ' '); // NBSP -> space
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  function stripTrailingPageNumber(s){
    // 끝에 1~4자리 숫자가 "페이지 번호"로 붙는 패턴 제거
    // (단, "1.1." 같은 번호 토큰은 이미 앞에서 처리)
    return s.replace(/\s+(\d{1,4})\s*$/,'').trim();
  }

  function parseLeadingNumberToken(s){
    // 반환: { token, rest, depth, kind }
    // kind: 'dot' (1.2), 'int' (1), 'none'
    const mDot = s.match(/^(\d+(?:\.\d+)+)\.?\s+(.*)$/);
    if (mDot){
      const token = mDot[1]; // 1.2.3
      const rest  = mDot[2].trim();
      const depth = token.split('.').length; // 2면 1.2
      return { token, rest, depth, kind:'dot' };
    }
    const mInt = s.match(/^(\d{1,4})\s+(.*)$/);
    if (mInt){
      const token = mInt[1];
      const rest  = mInt[2].trim();
      return { token, rest, depth:1, kind:'int' };
    }
    return { token:'', rest:s, depth:0, kind:'none' };
  }

  function shouldDropLine(s){
    if (!s) return true;
    if (s.startsWith('-') || s.startsWith('•')) return true;
    // 완전한 페이지 번호 라인(숫자만) 제거
    if (/^\d{1,4}$/.test(s)) return true;
    return false;
  }

  function formatWithIndent(depth, text, keepToken){
    // 깊이별 들여쓰기(2단까지만 의미있게)
    // depth 0: 0칸
    // depth 1: 0칸
    // depth 2: 2칸
    const indent = (depth >= 2) ? '  ' : '';
    return indent + text;
  }

  function normalizeToc(inputText){
    residualState = 0;
    const lines = inputText.split(/\r?\n/);
    const out = [];

    for (let i=0;i<lines.length;i++){
      let s = cleanLine(lines[i]);
      if (shouldDropLine(s)) continue;

      // 페이지 번호 제거
      s = stripTrailingPageNumber(s);

      // Chapter/Section 라인은 그대로
      if (/^Chapter\s+\d+/i.test(s) || /^SECTION\s+/i.test(s) || /^Part\s+/i.test(s)){
        out.push(s);
        continue;
      }

      const p = parseLeadingNumberToken(s);

      // 하하위(depth>=3) 제거
      if (p.kind === 'dot' && p.depth >= 3){
        continue;
      }

      // 단일 숫자 "1 INTRODUCTION" 형태는 숫자 제거하고 제목만
      if (p.kind === 'int'){
        // 단, "2026 ..." 같은 연도형은 제목으로 보존 (대개 TOC 아님이지만 방어)
        if (p.token.length === 4 && Number(p.token) >= 1900) {
          out.push(s);
        } else {
          out.push(formatWithIndent(1, p.rest, false));
        }
        continue;
      }

      // 1.2 형태는 유지(번호+제목)
      if (p.kind === 'dot'){
        const composed = `${p.token}. ${p.rest}`.trim();
        out.push(formatWithIndent(p.depth, composed, true));
        continue;
      }

      // 그 외 일반 라인
      out.push(s);
    }

    // 연속 중복 제거(같은 줄 반복 방지)
    const dedup = [];
    for (const line of out){
      if (dedup.length === 0 || dedup[dedup.length-1] !== line) dedup.push(line);
    }

    residualState = 0;
    return dedup.join('\n').trim();
  }

  // ====== 실행/버튼 ======
  function run(){
    const input = taIn.value || '';
    const output = normalizeToc(input);
    taOut.value = output;
    lastRun = { input, output };
    setPills();
  }

  document.getElementById('btnRun').addEventListener('click', run);

  document.getElementById('btnClearIn').addEventListener('click', () => { taIn.value=''; });
  document.getElementById('btnClearOut').addEventListener('click', () => { taOut.value=''; });

  document.getElementById('btnCopyOut').addEventListener('click', async () => {
    const text = taOut.value || '';
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      // fallback
      taOut.focus();
      taOut.select();
      document.execCommand('copy');
      taOut.setSelectionRange(0,0);
    }
  });

  document.getElementById('btnTopIn').addEventListener('click', () => { taIn.scrollTop = 0; taIn.focus(); });
  document.getElementById('btnTopOut').addEventListener('click', () => { taOut.scrollTop = 0; taOut.focus(); });

  // ====== 이력(화면 전용) ======
  function addLog(mark){
    const ts = nowStamp();
    const input = (lastRun.input || taIn.value || '').trim();
    const output = (lastRun.output || taOut.value || '').trim();

    const entry = document.createElement('div');
    entry.className = 'entry';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `[${ts}]  ${mark}`;
    entry.appendChild(meta);

    const b1 = document.createElement('div');
    b1.innerHTML = `<span class="label">- 원문:</span>\n${escapeHtml(input)}\n`;
    entry.appendChild(b1);

    const b2 = document.createElement('div');
    b2.innerHTML = `\n<span class="label">- 결과:</span>\n${escapeHtml(output)}\n`;
    entry.appendChild(b2);

    // 맨 위에 추가
    logEl.prepend(entry);
  }

  function escapeHtml(s){
    return (s || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;')
      .replace(/\n/g,'<br>');
  }

  document.getElementById('btnPass').addEventListener('click', () => addLog('PASS'));
  document.getElementById('btnFail').addEventListener('click', () => addLog('X'));
  document.getElementById('btnClearLog').addEventListener('click', () => { logEl.innerHTML = ''; });

})();
</script>
</body>
</html>
