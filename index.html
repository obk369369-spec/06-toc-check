<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TOC Check (Stable)</title>
<style>
body{font-family:sans-serif;padding:12px}
button{margin:2px}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{border:1px solid #ccc;padding:4px;text-align:left}
.status.PASS{color:green;font-weight:bold}
.status.X{color:red;font-weight:bold}
.status.UNJ{color:#999}
#saveBadge{font-size:12px;color:#555}
</style>
</head>
<body>

<h3>TOC Check <span id="saveBadge">-</span></h3>

<div>
<button onclick="setStatus('PASS')">PASS</button>
<button onclick="setStatus('X')">X</button>
<button onclick="setStatus('UNJ')">미판단</button>
<button onclick="removeSelected()">기준점 삭제</button>
</div>

<div>
PASS <span id="kPass">0</span> /
X <span id="kX">0</span> /
미판단 <span id="kUnj">0</span> /
전체 <span id="kTotal">0</span>
</div>

<table>
<thead>
<tr><th>ID</th><th>이름</th><th>상태</th><th>선택</th></tr>
</thead>
<tbody id="list"></tbody>
</table>

<hr>

<textarea id="importBox" rows="6" style="width:100%"></textarea><br>
<button onclick="doImport()">Import</button>
<button onclick="doExport()">Export</button>

<script>
(function(){
const LS_KEY="toc_check_state_v2";

const norm = v => {
  const s=String(v||"UNJ").trim().toUpperCase();
  return (s==="PASS"||s==="X"||s==="UNJ")?s:"UNJ";
};

let state={
  criteria:[],
  history:[],
  selectedId:null
};

function save(){
  localStorage.setItem(LS_KEY,JSON.stringify(state));
  document.getElementById("saveBadge").textContent="자동 저장됨";
}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LS_KEY)||"");
    if(d && Array.isArray(d.criteria)){
      state.criteria=d.criteria.map(c=>({
        id:String(c.id),
        name:String(c.name||""),
        status:norm(c.status),
        updatedAt:c.updatedAt||""
      }));
      state.history=Array.isArray(d.history)?d.history:[];
      state.selectedId=d.selectedId||null;
    }
  }catch(e){}
}

function render(){
  const pass=state.criteria.filter(c=>c.status==="PASS").length;
  const x=state.criteria.filter(c=>c.status==="X").length;
  const unj=state.criteria.length-pass-x;

  kPass.textContent=pass;
  kX.textContent=x;
  kUnj.textContent=unj;
  kTotal.textContent=state.criteria.length;

  const tb=list;
  tb.innerHTML="";
  state.criteria.forEach(c=>{
    const tr=document.createElement("tr");
    tr.onclick=()=>{state.selectedId=c.id;render();};
    tr.innerHTML=
      `<td>${c.id}</td>
       <td>${c.name}</td>
       <td class="status ${c.status}">${c.status}</td>
       <td>${state.selectedId===c.id?"선택됨":""}</td>`;
    tb.appendChild(tr);
  });
}

window.setStatus=function(v){
  if(!state.selectedId) return;
  const c=state.criteria.find(c=>c.id===state.selectedId);
  if(!c) return;
  const next=norm(v);
  if(c.status===next) return;
  state.history.push({
    ts:new Date().toISOString(),
    id:c.id,
    from:c.status,
    to:next,
    name:c.name
  });
  c.status=next;
  c.updatedAt=new Date().toISOString();
  save();
  render();
};

window.removeSelected=function(){
  if(!state.selectedId) return;
  state.criteria=state.criteria.filter(c=>c.id!==state.selectedId);
  state.selectedId=null;
  save();
  render();
};

window.doImport=function(){
  try{
    const d=JSON.parse(importBox.value);
    if(!Array.isArray(d.criteria)) throw 0;
    state.criteria=d.criteria.map(c=>({
      id:String(c.id),
      name:String(c.name||""),
      status:norm(c.status),
      updatedAt:c.updatedAt||""
    }));
    state.history=Array.isArray(d.history)?d.history:[];
    state.selectedId=null;
    save();
    render();
  }catch(e){
    alert("Import 실패");
  }
};

window.doExport=function(){
  importBox.value=JSON.stringify(state,null,2);
};

load();
render();
})();
</script>

</body>
</html>
