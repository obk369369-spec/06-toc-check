<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOC 정리 (저장소 사용 안함)</title>
  <style>
    :root{
      --bd:#cfcfcf; --bg:#fafafa; --tx:#111; --mut:#666;
      --btn:#f2f2f2; --btnbd:#bdbdbd;
    }
    body{margin:0;font-family:system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, sans-serif;color:var(--tx);background:#fff;}
    .wrap{max-width:1200px;margin:0 auto;padding:14px;}
    h1{font-size:18px;margin:0 0 10px 0;}
    .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 10px;}
    .btn{
      padding:7px 10px;border:1px solid var(--btnbd);background:var(--btn);
      border-radius:8px;font-size:13px;cursor:pointer;user-select:none;
    }
    .btn:active{transform:translateY(1px);}
    .badge{
      padding:6px 10px;border:1px solid var(--bd);background:var(--bg);
      border-radius:999px;font-size:12px;color:var(--mut);
    }

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .panel{border:1px solid var(--bd);border-radius:12px;background:#fff;overflow:hidden;}
    .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--bd);}
    .pt{font-size:13px;font-weight:700;}
    .mini{padding:6px 10px;border:1px solid var(--btnbd);background:var(--btn);border-radius:8px;font-size:12px;cursor:pointer;}
    textarea{
      width:100%;height:340px;resize:vertical;border:0;outline:none;
      padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:12px;line-height:1.35;white-space:pre;tab-size:2;
    }
    .hint{font-size:12px;color:var(--mut);padding:8px 10px;border-top:1px solid var(--bd);background:#fff;}
    .history{margin-top:12px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;}
    .hh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--bd);}
    .hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .log{
      padding:10px;min-height:120px;background:#fff;
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:12px;line-height:1.35;white-space:pre-wrap;
    }
    .footnote{padding:8px 10px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut);background:#fff;}
    @media (max-width: 900px){ .grid{grid-template-columns:1fr;} textarea{height:300px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TOC 정리 (저장소 사용 안함)</h1>

    <div class="topbar">
      <button class="btn" id="btnClean">정리</button>
      <button class="btn" id="btnClearIn">입력 지우기</button>
      <button class="btn" id="btnClearOut">출력 지우기</button>
      <button class="btn" id="btnCopyOut">출력 복사</button>

      <span class="badge" id="badgeResidual">Residual State: 0</span>
      <span class="badge" id="badgeStorage">storage-read: OFF / storage-write: OFF</span>
      <span class="badge" id="badgeDone">DONE</span>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="ph">
          <div class="pt">입력 (원문 TOC)</div>
          <button class="mini" id="btnTopIn">▲ 위로</button>
        </div>
        <textarea id="taIn" spellcheck="false" placeholder="여기에 목차를 붙여 넣고 [정리]를 누르세요."></textarea>
      </div>

      <div class="panel">
        <div class="ph">
          <div class="pt">출력 (정리 결과)</div>
          <button class="mini" id="btnTopOut">▲ 위로</button>
        </div>
        <textarea id="taOut" spellcheck="false" placeholder="정리 결과가 여기에 나옵니다."></textarea>
        <div class="hint">※ 출력 복사는 스크롤 위치와 무관하게 전체가 복사됩니다.</div>
      </div>
    </div>

    <div class="history">
      <div class="hh">
        <div class="pt">이력 (화면 전용 · 저장 안함)</div>
        <div class="hbtns">
          <button class="btn" id="btnPass">PASS</button>
          <button class="btn" id="btnX">X</button>
          <button class="btn" id="btnClearHist">이력 화면만 지우기</button>
        </div>
      </div>
      <div class="log" id="log"></div>
      <div class="footnote">※ 이 파일은 localStorage / sessionStorage / indexedDB 를 읽거나 쓰지 않습니다. (화면을 닫으면 이력은 사라짐)</div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ====== 저장소 완전 차단(코드 레벨) ======
  // (접근 자체를 사용하지 않지만, 실수 방지용으로 읽기/쓰기 시도도 막음)
  const blockStorage = (objName) => {
    try {
      const obj = window[objName];
      if (!obj) return;
      const deny = () => { throw new Error(objName + " access blocked"); };
      for (const k of ["getItem","setItem","removeItem","clear","key"]) {
        if (typeof obj[k] === "function") obj[k] = deny;
      }
    } catch(_) {}
  };
  blockStorage("localStorage");
  blockStorage("sessionStorage");
  // indexedDB는 호출 자체를 안 함(필요 없음)

  // ====== DOM ======
  const taIn = document.getElementById("taIn");
  const taOut = document.getElementById("taOut");
  const logEl = document.getElementById("log");
  const badgeResidual = document.getElementById("badgeResidual");

  const btnClean = document.getElementById("btnClean");
  const btnClearIn = document.getElementById("btnClearIn");
  const btnClearOut = document.getElementById("btnClearOut");
  const btnCopyOut = document.getElementById("btnCopyOut");
  const btnTopIn = document.getElementById("btnTopIn");
  const btnTopOut = document.getElementById("btnTopOut");

  const btnPass = document.getElementById("btnPass");
  const btnX = document.getElementById("btnX");
  const btnClearHist = document.getElementById("btnClearHist");

  // ====== 이력(화면 전용 메모리) ======
  let historyCount = 0;

  const nowStamp = () => {
    const d = new Date();
    const p = (n)=> String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };

  const addHistory = (tag) => {
    historyCount++;
    badgeResidual.textContent = `Residual State: ${historyCount}`;

    const inText = taIn.value || "";
    const outText = taOut.value || "";

    // 너무 길면 화면만 보기 좋게 일부만
    const clip = (s, max=1200) => s.length > max ? (s.slice(0, max) + "\n... (cut)") : s;

    const entry =
`[${nowStamp()}]  ${tag}
- 원문(일부):
${clip(inText.trim())}

- 결과(일부):
${clip(outText.trim())}
`;
    logEl.textContent = (entry + "\n" + logEl.textContent).trimEnd();
  };

  // ====== 핵심 정리 로직 ======
  const isOnlyNumberLine = (t) => /^\d+$/.test(t);
  const isBulletExplainLine = (t) => /^[-–—•·]\s+/.test(t);      // - / – / — / • / · 로 시작하는 설명 줄 제거
  const normalizeSpaces = (s) => s.replace(/\t/g, "  ");

  // 번호 패턴: "1.", "1.2", "1.2.3", "5.1 INTRODUCTION"
  const numPrefix = (t) => {
    const m = t.match(/^(\d+(?:\.\d+)*)(?:\.)?\s+/);
    return m ? m[1] : null;
  };

  const chapterPrefix = (t) => /^chapter\s+\d+(\.|:)?/i.test(t);

  // 들여쓰기 계산: 번호 깊이 기반(안정적)
  const buildIndent = (trimmed) => {
    const n = numPrefix(trimmed);
    if (n) {
      const depth = n.split(".").length - 1;  // 1.2.3 => 2
      return "  ".repeat(Math.max(0, depth)); // 2칸 * depth
    }
    // Chapter 라인은 depth 0
    if (chapterPrefix(trimmed)) return "";
    // 기존에 앞 공백이 있었던 경우(복사본) 약간만 유지
    return "";
  };

  const keepLine = (trimmed) => {
    if (!trimmed) return false;              // 빈줄 제거
    if (isOnlyNumberLine(trimmed)) return false; // "27" 같은 페이지번호 제거
    if (isBulletExplainLine(trimmed)) return false; // "- Growing..." 같은 설명 줄 제거
    return true;
  };

  const cleanTOC = (raw) => {
    const lines = normalizeSpaces(raw).split(/\r?\n/);

    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const original = lines[i];
      const trimmed = original.trim();

      if (!keepLine(trimmed)) continue;

      // 과도한 공백 정리(중간 공백은 1칸만)
      const compact = trimmed.replace(/\s{2,}/g, " ");

      // 들여쓰기 생성
      const indent = buildIndent(compact);

      out.push(indent + compact);
    }

    // 연속 중복 줄 제거(가끔 복사본에서 반복됨)
    const dedup = [];
    for (const line of out) {
      if (dedup.length && dedup[dedup.length - 1] === line) continue;
      dedup.push(line);
    }

    return dedup.join("\n").trim() + (dedup.length ? "\n" : "");
  };

  // ====== UI 동작 ======
  btnClean.addEventListener("click", () => {
    taOut.value = cleanTOC(taIn.value || "");
  });

  btnClearIn.addEventListener("click", () => { taIn.value = ""; taIn.focus(); });
  btnClearOut.addEventListener("click", () => { taOut.value = ""; taOut.focus(); });

  btnCopyOut.addEventListener("click", async () => {
    const text = taOut.value || "";
    try {
      await navigator.clipboard.writeText(text);
      // 조용히(알림 최소)
    } catch (e) {
      // clipboard 실패시 fallback
      taOut.focus();
      taOut.select();
      document.execCommand("copy");
      taOut.setSelectionRange(0, 0);
    }
  });

  const scrollTopBox = (ta) => { ta.scrollTop = 0; ta.focus(); };
  btnTopIn.addEventListener("click", () => scrollTopBox(taIn));
  btnTopOut.addEventListener("click", () => scrollTopBox(taOut));

  btnPass.addEventListener("click", () => addHistory("PASS"));
  btnX.addEventListener("click", () => addHistory("X"));

  btnClearHist.addEventListener("click", () => {
    logEl.textContent = "";
    historyCount = 0;
    badgeResidual.textContent = "Residual State: 0";
  });

})();
</script>
</body>
</html>
