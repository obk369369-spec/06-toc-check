<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>6번 도구: TOC Check (C021 고정)</title>
  <style>
    :root{
      --bd:#cfcfcf;
      --bg:#ffffff;
      --muted:#666;
      --btn:#f4f4f4;
      --btnbd:#bdbdbd;
      --shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif;
      background:#fff;
      color:#111;
    }
    .wrap{ max-width:1100px; margin:18px auto; padding:0 14px 28px; }
    h1{ margin:0 0 6px; font-size:22px; font-weight:800; }
    .sub{ margin:0 0 14px; color:var(--muted); font-size:13px; }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    .panel{
      border:1px solid var(--bd);
      background:var(--bg);
      border-radius:6px;
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel .hd{
      padding:10px 10px;
      border-bottom:1px solid var(--bd);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:#fafafa;
    }
    .panel .hd .title{
      font-weight:700;
      font-size:14px;
    }
    .panel .bd{
      padding:10px;
    }

    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    button{
      border:1px solid var(--btnbd);
      background:var(--btn);
      padding:8px 10px;
      border-radius:6px;
      cursor:pointer;
      font-size:13px;
    }
    button:active{ transform:translateY(1px); }

    .ioRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 900px){
      .ioRow{ grid-template-columns: 1fr; }
    }

    .boxWrap{
      position:relative;
      border:1px solid var(--bd);
      border-radius:6px;
      overflow:hidden;
      background:#fff;
    }
    textarea{
      width:100%;
      min-height:220px;
      resize:vertical;
      border:0;
      outline:none;
      padding:10px 44px 10px 10px; /* 오른쪽 버튼 공간 확보 */
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:12.5px;
      line-height:1.35;
      white-space:pre;
      overflow:auto;
    }
    textarea[readonly]{ background:#fcfcfc; }

    /* 입력/출력 박스별 위로가기 버튼 */
    .toTop{
      position:absolute;
      right:8px;
      bottom:8px;
      width:32px;
      height:32px;
      border-radius:8px;
      border:1px solid var(--btnbd);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: var(--shadow);
      user-select:none;
    }
    .toTop:hover{ background:#f7f7f7; }
    .toTop span{ font-size:15px; line-height:1; }

    .sectionTitle{
      margin:0 0 8px;
      font-weight:800;
      font-size:14px;
    }

    .historyArea{
      width:100%;
      min-height:64px;
      resize:vertical;
      border:1px solid var(--bd);
      border-radius:6px;
      padding:8px 10px;
      font-size:13px;
      outline:none;
    }
    .hint{ color:var(--muted); font-size:12px; margin:6px 0 0; }
    .saved{
      margin-top:10px;
      border:1px solid var(--bd);
      border-radius:6px;
      padding:10px;
      background:#fff;
      max-height:260px;
      overflow:auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size:12px;
      line-height:1.35;
      white-space:pre-wrap;
    }
    .saved .item{ padding:6px 0; border-bottom:1px dashed #ddd; }
    .saved .item:last-child{ border-bottom:0; }
    .tag{
      display:inline-block;
      padding:1px 6px;
      border-radius:999px;
      border:1px solid #bbb;
      font-size:11px;
      margin-right:6px;
      background:#fff;
    }
    .tag.pass{ border-color:#7fbf7f; }
    .tag.x{ border-color:#d28b8b; }
    .meta{ color:#444; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>6번 도구: TOC Check (C021 고정)</h1>
    <p class="sub">규칙: 상위(예: 1 / 1. / SECTION I / Executive Summary) + 하위(예: 1.1 / 14.6)만 남김 / 1.1.1 이상 제거 / 페이지번호 제거 / 하위는 들여쓰기</p>

    <div class="panel">
      <div class="hd">
        <div class="title">입력</div>
        <div class="btns">
          <button id="runBtn">분류 실행</button>
          <button id="clearBtn">초기화</button>
          <button id="copyBtn">결과 복사</button>
        </div>
      </div>

      <div class="bd">
        <div class="ioRow">
          <!-- INPUT -->
          <div>
            <div class="sectionTitle">원문 TOC</div>
            <div class="boxWrap">
              <textarea id="input" placeholder="여기에 목차를 붙여넣기"></textarea>
              <button class="toTop" type="button" id="inputTopBtn" title="입력 위로">
                <span>▲</span>
              </button>
            </div>
          </div>

          <!-- OUTPUT -->
          <div>
            <div class="sectionTitle">결과</div>
            <div class="boxWrap">
              <textarea id="output" readonly></textarea>
              <button class="toTop" type="button" id="outputTopBtn" title="출력 위로">
                <span>▲</span>
              </button>
            </div>
          </div>
        </div>

        <div style="height:14px"></div>

        <div class="panel" style="border-radius:6px;">
          <div class="hd">
            <div class="title">이력 (PASS / X)</div>
            <div class="btns">
              <button id="passBtn">PASS 기록</button>
              <button id="xBtn">X 기록</button>
              <button id="loadBtn">이력 불러오기</button>
            </div>
          </div>
          <div class="bd">
            <textarea id="memo" class="historyArea" placeholder="테스트 결과/메모를 적고 PASS 또는 X를 누르기"></textarea>
            <div class="hint">저장 위치: 이 브라우저 localStorage (새로고침/재접속해도 유지)</div>
            <div class="saved" id="savedBox" aria-label="저장된 이력"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /***********************
     * 저장 키 (파일 교체해도 유지)
     ************************/
    const KEY_HISTORY = "tocCheck_history_v1";
    const KEY_LAST_INPUT = "tocCheck_lastInput_v1";
    const KEY_LAST_OUTPUT = "tocCheck_lastOutput_v1";

    const $ = (id) => document.getElementById(id);

    const inputEl = $("input");
    const outputEl = $("output");
    const memoEl = $("memo");
    const savedBox = $("savedBox");

    function nowStamp(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mi = String(d.getMinutes()).padStart(2,"0");
      const ss = String(d.getSeconds()).padStart(2,"0");
      return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
    }

    function safeJsonParse(s, fallback){
      try{ return JSON.parse(s); }catch(e){ return fallback; }
    }

    function getHistory(){
      const raw = localStorage.getItem(KEY_HISTORY);
      const arr = safeJsonParse(raw, []);
      return Array.isArray(arr) ? arr : [];
    }

    function setHistory(arr){
      localStorage.setItem(KEY_HISTORY, JSON.stringify(arr));
    }

    function renderHistory(){
      const arr = getHistory();
      if(arr.length === 0){
        savedBox.textContent = "저장된 이력 없음";
        return;
      }
      savedBox.innerHTML = "";
      [...arr].reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        const tag = document.createElement("span");
        tag.className = "tag " + (item.status === "PASS" ? "pass" : "x");
        tag.textContent = item.status;
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `[${item.time}]`;

        const pre = document.createElement("div");
        pre.style.marginTop = "6px";
        pre.textContent =
`- 메모: ${item.memo || "(없음)"}
- 입력: ${item.inputPreview || "(없음)"}
- 결과: ${item.outputPreview || "(없음)"}`;

        div.appendChild(tag);
        div.appendChild(meta);
        div.appendChild(pre);
        savedBox.appendChild(div);
      });
    }

    function addHistory(status){
      const memo = (memoEl.value || "").trim();
      const inputText = (inputEl.value || "").trim();
      const outputText = (outputEl.value || "").trim();

      const inputPreview = inputText.replace(/\s+/g," ").slice(0, 140);
      const outputPreview = outputText.replace(/\s+/g," ").slice(0, 140);

      const arr = getHistory();
      arr.push({
        time: nowStamp(),
        status,
        memo,
        inputPreview,
        outputPreview
      });
      setHistory(arr);
      renderHistory();
    }

    /***********************
     * TOC 필터링 (상위 + 1.1만)
     * - 1.1.1 이상 제거
     * - 페이지번호(단독/말미) 제거
     * - 한 줄로 붙은 목차도 줄로 쪼개기
     ************************/

    // 자주 나오는 "번호 없는 상위 제목" 토큰(공백으로 붙어서 들어올 때 분리용)
    const KNOWN_TOP_TOKENS = [
      "Executive Summary",
      "Scope and Definition",
      "Scope & Definition",
      "Introduction",
      "Research Scope",
      "Market Segmentation",
      "Research Methodology",
      "Methodology",
      "Definitions & Assumptions",
      "Key Insights",
      "Market Dynamics",
      "Market Drivers",
      "Market Restraints",
      "Market Opportunities",
      "Appendix",
      "List of Tables",
      "List of Figures"
    ];

    function normalizeLine(s){
      return s
        .replace(/\u00A0/g, " ")
        .replace(/[ \t]+/g, " ")
        .replace(/\s+$/g,"")
        .replace(/^\s+/g,"");
    }

    function stripTrailingPage(line){
      // 끝에 붙는 페이지번호 제거: "... 28" / "... 314"
      return line.replace(/\s+\d{1,4}\s*$/,"").trim();
    }

    function isPageOnly(line){
      return /^\d{1,4}$/.test(line);
    }

    function isDeeperThanSub(line){
      // 1.1.1 이상
      return /^\d{1,3}\.\d{1,3}\.\d/.test(line);
    }

    function isSubLevelLine(line){
      // 1.1 / 14.6 같은 1단계 하위(마지막에 점 있는 경우도 허용)
      if(/^\d{1,3}\.\d{1,3}\.?\b/.test(line) && !/^\d{1,3}\.\d{1,3}\.\d/.test(line)) return true;
      return false;
    }

    function isTopLevelLine(line){
      // 01 / 1 / 2 / 10 같은 숫자 단독 (단, 페이지번호 단독은 위에서 제거됨)
      if(/^\d{1,3}$/.test(line)) return true;

      // "1." 단독
      if(/^\d{1,3}\.$/.test(line)) return true;

      // "1 Introduction" / "1 INTRODUCTION" / "1. Introduction" / "1. Introduction 28"
      if(/^\d{1,3}\.?\s+\S+/.test(line) && !/^\d{1,3}\.\d+/.test(line)) return true;

      // "SECTION I ..." / "CHAPTER 1 ..." / "PART 1 ..."
      if(/^(CHAPTER|SECTION|PART)\b/i.test(line)) return true;

      // 로마숫자 단독 (I, II, III 등)
      if(/^(I|II|III|IV|V|VI|VII|VIII|IX|X)$/.test(line)) return true;

      // 번호 없는 상위 제목: 짧고, 너무 긴 문장/문장부호 과다 제외
      // (실무 TOC 상위 제목이 자주 이런 형태)
      if(
        /^[A-Za-z][A-Za-z &\-\/]{2,60}$/.test(line) &&
        !/^\d{1,4}\s*to\s*\d{1,4}\s*MW$/i.test(line) // "101 to 200 MW" 같은 분류값 단독은 제외
      ){
        return true;
      }

      return false;
    }

    function splitJoinedTextToLines(text){
      let s = String(text || "");
      s = s.replace(/\r/g, "\n");

      // 탭/여러 공백 → 공백
      s = s.replace(/[ \t]+/g, " ");

      // 1) SECTION/CHAPTER/PART 앞에 줄바꿈
      s = s.replace(/\s+(SECTION|CHAPTER|PART)\b/gi, "\n$1");

      // 2) " 2 RESEARCH ..." 같은 패턴(숫자+대문자) 앞에 줄바꿈
      //    (단, "1.1" 같은 소수점은 제외)
      s = s.replace(/(\s)(\d{1,3})(?=\s+[A-Z])/g, "\n$2");

      // 3) " 4. Market ..." 같은 패턴(숫자+점+공백) 앞에 줄바꿈
      s = s.replace(/(\s)(\d{1,3}\.)(?=\s)/g, "\n$2");

      // 4) " 5.1 " / " 14.6 " 같은 하위 앞에 줄바꿈
      s = s.replace(/(\s)(\d{1,3}\.\d{1,3})(?=\s)/g, "\n$2");

      // 5) 번호 없는 상위 토큰들도 줄로 분리(붙여넣기 한 줄일 때)
      for(const tok of KNOWN_TOP_TOKENS){
        const re = new RegExp("\\s+(" + tok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "g");
        s = s.replace(re, "\n$1");
      }

      // 6) 줄바꿈 정리
      s = s.replace(/\n{2,}/g, "\n").trim();
      return s;
    }

    function filterToc(text){
      const prepared = splitJoinedTextToLines(text);
      const rawLines = prepared.split(/\n/);

      const kept = [];
      const seen = new Set();

      for(let raw of rawLines){
        let line = normalizeLine(raw);
        if(!line) continue;

        // 말미 페이지번호 제거
        line = stripTrailingPage(line);
        if(!line) continue;

        // 페이지번호만 있는 줄 제거
        if(isPageOnly(line)) continue;

        // 1.1.1 이상 제거
        if(isDeeperThanSub(line)) continue;

        // 분류값(예: 101 to 200 MW) 같은 "숫자 범위" 단독은 제거
        if(/^\d{1,4}\s*to\s*\d{1,4}\s*MW$/i.test(line)) continue;

        // 상위/하위만 유지
        if(isTopLevelLine(line)){
          const key = "T:" + line.toLowerCase();
          if(!seen.has(key)){
            kept.push(line);
            seen.add(key);
          }
          continue;
        }

        if(isSubLevelLine(line)){
          const key = "S:" + line.toLowerCase();
          if(!seen.has(key)){
            kept.push("  " + line); // 하위는 들여쓰기
            seen.add(key);
          }
          continue;
        }

        // 그 외 제거
      }

      return kept.join("\n");
    }

    /***********************
     * 버튼 동작
     ************************/
    $("runBtn").addEventListener("click", () => {
      const inText = inputEl.value || "";
      const outText = filterToc(inText);
      outputEl.value = outText;

      localStorage.setItem(KEY_LAST_INPUT, inText);
      localStorage.setItem(KEY_LAST_OUTPUT, outText);
    });

    $("clearBtn").addEventListener("click", () => {
      inputEl.value = "";
      outputEl.value = "";
      memoEl.value = "";
      localStorage.removeItem(KEY_LAST_INPUT);
      localStorage.removeItem(KEY_LAST_OUTPUT);
    });

    $("copyBtn").addEventListener("click", async () => {
      const t = outputEl.value || "";
      if(!t.trim()) return;
      try{
        await navigator.clipboard.writeText(t);
      }catch(e){
        outputEl.focus();
        outputEl.select();
        document.execCommand("copy");
        outputEl.setSelectionRange(0,0);
      }
    });

    $("passBtn").addEventListener("click", () => addHistory("PASS"));
    $("xBtn").addEventListener("click", () => addHistory("X"));

    $("loadBtn").addEventListener("click", () => renderHistory());

    $("inputTopBtn").addEventListener("click", () => { inputEl.scrollTop = 0; inputEl.focus(); });
    $("outputTopBtn").addEventListener("click", () => { outputEl.scrollTop = 0; outputEl.focus(); });

    (function init(){
      const lastIn = localStorage.getItem(KEY_LAST_INPUT);
      const lastOut = localStorage.getItem(KEY_LAST_OUTPUT);
      if(lastIn) inputEl.value = lastIn;
      if(lastOut) outputEl.value = lastOut;
      renderHistory();
    })();
  </script>
</body>
</html>
