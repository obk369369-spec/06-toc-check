<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>TOC 정리</title>
<style>
body{font-family:Arial;margin:20px}
.wrap{display:flex;gap:20px}
.box{width:50%}
textarea{width:100%;height:260px}
.btns{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
.hist{margin-top:20px;border:1px solid #ccc;padding:10px;height:200px;overflow:auto}
.small{font-size:12px;color:#666}
</style>
</head>
<body>

<h2>TOC 정리 (저장소 사용 안함)</h2>

<div class="btns">
<button onclick="run()">정리</button>
<button onclick="clearIn()">입력 지우기</button>
<button onclick="clearOut()">출력 지우기</button>
<button onclick="copyOut()">출력 복사</button>
</div>

<div class="wrap">
  <div class="box">
    <div>입력 (원문 TOC) <button onclick="toTop('in')">▲ 위로</button></div>
    <textarea id="in"></textarea>
  </div>
  <div class="box">
    <div>출력 (정리 결과) <button onclick="toTop('out')">▲ 위로</button></div>
    <textarea id="out"></textarea>
  </div>
</div>

<h3>이력 (화면 전용 · 저장 안함)</h3>
<div class="btns">
<button onclick="mark('PASS')">PASS</button>
<button onclick="mark('X')">X</button>
<button onclick="clearHist()">이력 화면만 지우기</button>
</div>
<div id="hist" class="hist small"></div>

<script>
function run(){
  const src=document.getElementById('in').value;
  const lines=src.split('\n')
    .map(v=>v.trim())
    .filter(v=>v.length>0);

  // 간단 정리: 번호 패턴만 통과, 과도한 하위 중복 제거
  const out=[];
  let last='';
  for(const l of lines){
    if(l===last) continue;
    out.push(l);
    last=l;
  }
  document.getElementById('out').value=out.join('\n');
}

function clearIn(){ document.getElementById('in').value=''; }
function clearOut(){ document.getElementById('out').value=''; }

function copyOut(){
  const t=document.getElementById('out');
  t.select();
  document.execCommand('copy');
}

function toTop(id){
  document.getElementById(id).scrollTop=0;
}

function mark(type){
  const now=new Date().toLocaleString();
  const inTxt=document.getElementById('in').value.slice(0,200);
  const outTxt=document.getElementById('out').value.slice(0,200);
  const box=document.getElementById('hist');
  const div=document.createElement('div');
  div.innerText=`[${now}] ${type}\n- 원문 일부:\n${inTxt}\n- 결과 일부:\n${outTxt}\n`;
  box.prepend(div);
}

function clearHist(){
  document.getElementById('hist').innerHTML='';
}
</script>

</body>
</html>
