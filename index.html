<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TOC 정리 (저장소 사용 안함)</title>
<style>
body { font-family: monospace; margin:20px; }
textarea { width:48%; height:260px; }
.row { display:flex; gap:10px; }
button { margin:3px; }
#history { border:1px solid #ccc; height:160px; overflow:auto; padding:6px; }
.small { font-size:12px; color:#666; }
</style>
</head>
<body>

<h3>TOC 정리 (저장소 사용 안함)</h3>

<div>
  <button onclick="run()">정리</button>
  <button onclick="clearInput()">입력 지우기</button>
  <button onclick="clearOutput()">출력 지우기</button>
  <button onclick="copyOutput()">출력 복사</button>
</div>

<div class="row">
  <div style="width:50%">
    <div>입력 (원문 TOC) <button onclick="scrollTopBox('input')">▲ 위로</button></div>
    <textarea id="input"></textarea>
  </div>
  <div style="width:50%">
    <div>출력 (정리 결과) <button onclick="scrollTopBox('output')">▲ 위로</button></div>
    <textarea id="output"></textarea>
  </div>
</div>

<br>

<div>
  <button onclick="addHistory('PASS')">PASS</button>
  <button onclick="addHistory('X')">X</button>
  <button onclick="clearHistory()">이력 화면만 지우기</button>
</div>

<div id="history"></div>
<div class="small">※ localStorage / sessionStorage / indexedDB 사용 안함 (창 닫으면 이력 사라짐)</div>

<script>
function scrollTopBox(id){
  document.getElementById(id).scrollTop = 0;
}

function clearInput(){ document.getElementById('input').value=''; }
function clearOutput(){ document.getElementById('output').value=''; }

function copyOutput(){
  const t = document.getElementById('output');
  t.select();
  document.execCommand('copy');
}

function addHistory(type){
  const box = document.getElementById('history');
  const now = new Date().toISOString().replace('T',' ').slice(0,19);
  const div = document.createElement('div');
  div.textContent = `[${now}] ${type}`;
  box.appendChild(div);
}

function clearHistory(){
  document.getElementById('history').innerHTML='';
}

function isUpperTitle(line){
  // 전부 대문자 + 짧은 길이
  return /^[A-Z0-9 \-\/&]{3,60}$/.test(line);
}

function isNumberTitle(line){
  // 1 / 1.1 / 5.2 같은 형태만
  return /^\d+(\.\d+){0,1}\s/.test(line);
}

function isSentence(line){
  // 문장/불릿 제거
  if(line.includes('-')) return true;
  if(line.length>80) return true;
  if(/[a-z]{3,}/.test(line) && line.split(' ').length>6) return true;
  return false;
}

function run(){
  const raw = document.getElementById('input').value.split('\n');
  const out = [];
  for(let l of raw){
    l = l.trim();
    if(!l) continue;

    if(isSentence(l)) continue;

    if(isUpperTitle(l)){
      out.push(l);
      continue;
    }

    if(isNumberTitle(l)){
      // 하하위(1.1.1) 제거 → 점 2개 이상이면 제거
      if((l.match(/\./g)||[]).length>=2) continue;
      out.push(l);
      continue;
    }
  }
  document.getElementById('output').value = out.join('\n');
}
</script>

</body>
</html>
