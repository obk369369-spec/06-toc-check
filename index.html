<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TOC Check</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    h3 { margin: 0 0 10px; }
    textarea { width: 100%; height: 240px; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border: 1px solid #ddd; min-height: 220px; }
    button { margin: 8px 6px 0 0; padding: 8px 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .hint { color:#666; font-size: 12px; }
  </style>
</head>
<body>
  <h3>6번 도구: TOC Check (C021 고정)</h3>

  <div class="hint">규칙: 상위(예: 1) + 하위(예: 1.1)만 남김 / 그 외 전부 제거 / 하위는 들여쓰기</div>
  <textarea id="input" placeholder="여기에 목차를 붙여넣기"></textarea>

  <div class="row">
    <button id="btnRun" type="button">분류 실행</button>
    <button id="btnClear" type="button">초기화</button>
  </div>

  <h4>결과</h4>
  <pre id="output"></pre>

<script>
(() => {
  const $in = document.getElementById("input");
  const $out = document.getElementById("output");
  const $run = document.getElementById("btnRun");
  const $clear = document.getElementById("btnClear");

  // (1) "1", "1.", "1 INTRODUCTION" / "1.1", "1.1." "1.1 Title" 만 인식
  // (2) 1.1.1 이상(점이 2개 이상)은 제거
  // (3) 페이지번호 같은 "27" "32" 단독 숫자 제거
  // (4) Table of Contents / TOC / CONTENTS 같은 머릿글 제거
  // (5) 불릿/대시로 시작하는 줄은 제거 (번호 없는 목록)
  function isJunkHeader(line) {
    const s = line.trim().toLowerCase();
    if (!s) return true;
    if (s === "table of contents" || s === "toc" || s === "contents") return true;
    if (s.includes("table of content")) return true;
    return false;
  }

  function run() {
    const text = $in.value || "";
    const lines = text.split(/\r?\n/);

    const result = [];
    const seen = new Set();

    for (let raw of lines) {
      let line = raw.replace(/\u00A0/g, " ").trim(); // nbsp 제거
      if (!line) continue;

      // 쓸데없는 머릿글/라벨 제거
      if (isJunkHeader(line)) continue;

      // 불릿/대시 목록 제거 (번호 없는 잡목차)
      if (/^[•\-\u2022]/.test(line)) continue;

      // "27" 같은 페이지번호 단독 숫자 제거
      if (/^\d{1,4}$/.test(line)) continue;

      // 앞에 번호가 아닌 줄 제거
      // 허용: "1", "1.", "1  TITLE", "1.1", "1.1.", "1.1  TITLE"
      const m = line.match(/^(\d+(?:\.\d+)*)(?:\.)?\s*(.*)$/);
      if (!m) continue;

      const num = m[1];          // 1 / 1.1 / 1.1.1 ...
      const title = (m[2] || "").trim();

      // 점 개수로 깊이 계산: 0=상위(1), 1=하위(1.1), 2+=삭제(1.1.1...)
      const dotCount = (num.match(/\./g) || []).length;

      // 상위+하위만 남김
      if (dotCount >= 2) continue;

      // 출력 문자열 구성(원문 라인 유지하되 정돈)
      // - 제목이 비어 있으면 번호만 출력
      // - 중복 제거
      let outLine = "";
      if (title) outLine = `${num} ${title}`;
      else outLine = `${num}`;

      // 하위는 들여쓰기
      if (dotCount === 1) outLine = "  " + outLine;

      const key = outLine.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);

      result.push(outLine);
    }

    $out.textContent = result.join("\n");
  }

  function clearAll() {
    $in.value = "";
    $out.textContent = "";
  }

  $run.addEventListener("click", run);
  $clear.addEventListener("click", clearAll);
})();
</script>
</body>
</html>
