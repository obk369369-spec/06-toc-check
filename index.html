<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>6번 도구: TOC Check (C021 고정)</title>
<style>
  body{font-family:Consolas, monospace;margin:20px;}
  h2{margin:0 0 6px 0;}
  .rule{margin:0 0 10px 0;color:#333;font-size:13px;}
  textarea{width:100%;height:180px;font-family:Consolas, monospace;font-size:13px;line-height:1.35;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  button{padding:8px 14px;cursor:pointer;}
  .result-wrap{margin-top:16px;}
  .label{font-weight:700;margin:14px 0 6px 0;}
  .result-box{
    border:1px solid #ccc;
    padding:0;              /* ✅ 왼쪽 여백 0 */
    margin:0;
  }
  .result-box pre{
    margin:0;               /* ✅ 왼쪽 여백 0 */
    padding:10px;           /* 박스 안쪽만 최소 */
    white-space:pre;        /* 줄바꿈 그대로 */
    text-indent:0;
    font-family:Consolas, monospace;
    line-height:1.4;
    font-size:13px;
  }

  /* 이력 */
  .history-box{
    border:1px solid #ccc;
    padding:10px;
  }
  .history-box textarea{
    height:120px;
  }
  .small{font-size:12px;color:#444;margin-top:6px;}
</style>
</head>

<body>
  <h2>6번 도구: TOC Check (C021 고정)</h2>
  <p class="rule">규칙: 상위(예: 1) + 하위(예: 1.1)만 남김 / 그 외 제거 / 하위는 들여쓰기</p>

  <textarea id="inputText" placeholder="목차 전체를 그대로 붙여넣기"></textarea>

  <div class="row">
    <button id="runBtn" onclick="run()">분류 실행</button>
    <button id="resetBtn" onclick="resetText()">초기화</button>
    <button id="copyBtn" onclick="copyResult()">결과 복사</button>
  </div>

  <div class="result-wrap">
    <div class="label">결과</div>
    <div class="result-box"><pre id="outputText"></pre></div>
  </div>

  <div class="result-wrap">
    <div class="label">이력 (PASS / X)</div>
    <div class="history-box">
      <textarea id="historyInput" placeholder="테스트 결과/메모를 적고 PASS 또는 X를 누르기"></textarea>
      <div class="row">
        <button onclick="addLog('PASS')">PASS 기록</button>
        <button onclick="addLog('X')">X 기록</button>
        <button onclick="loadLogs()">이력 불러오기</button>
        <button onclick="clearLogs()">이력 초기화</button>
      </div>
      <div class="small">저장 위치: 이 브라우저 localStorage (새로고침/재접속해도 유지)</div>
      <div class="label">저장된 이력</div>
      <div class="result-box"><pre id="historyView"></pre></div>
    </div>
  </div>

<script>
/* =========================
   핵심: 숫자만 있는 줄 제거 + "번호 + 제목"만 인정
   - MarketsandMarkets처럼 페이지번호가 따로 있는 경우(29/34/45...)가 섞여도 무시
   ========================= */

function run(){
  const input = document.getElementById("inputText").value || "";
  const lines = input.split(/\r?\n/);

  const out = [];

  for (let raw of lines) {
    const line = raw.replace(/\t/g, " ").trim();
    if (!line) continue;

    // 1) 숫자만 있는 줄(페이지번호 등) 무조건 제거
    if (/^\d+$/.test(line)) continue;

    // 2) "번호 + 제목" 패턴만 인정
    //    - 번호 다음에 공백이 있고,
    //    - 그 뒤에 영문/한글/기호 포함 "제목"이 있어야 함
    //    예) "1 INTRODUCTION", "5 MARKET OVERVIEW", "5.2 MARKET DYNAMICS"
    const m = line.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
    if (!m) continue;

    const num = m[1];
    const title = m[2].trim();

    // 3) 제목이 사실상 숫자/기호만이면 제거 (오염 방지)
    //    (예: "5.1"만 남는 경우 차단)
    if (!/[A-Za-z가-힣]/.test(title)) continue;

    // 4) 상위/하위만 남김
    if (/^\d+$/.test(num)) {
      out.push(`${num} ${title}`);
    } else if (/^\d+\.\d+$/.test(num)) {
      out.push(`  ${num} ${title}`);
    }
  }

  document.getElementById("outputText").textContent = out.join("\n");
}

function resetText(){
  document.getElementById("inputText").value = "";
  document.getElementById("outputText").textContent = "";
}

/* 결과 복사 */
function copyResult(){
  const text = document.getElementById("outputText").textContent || "";
  if (!text.trim()) return;
  navigator.clipboard.writeText(text);
}

/* =========================
   이력(PASS/X) localStorage 누적
   ========================= */
const LOG_KEY = "toc_check_history_v1";

function nowStamp(){
  const d = new Date();
  const pad = (n)=> String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function addLog(type){
  const memo = (document.getElementById("historyInput").value || "").trim();
  const inputPreview = (document.getElementById("inputText").value || "").trim().slice(0, 120).replace(/\s+/g," ");
  const outputPreview = (document.getElementById("outputText").textContent || "").trim().slice(0, 120).replace(/\s+/g," ");

  const entry = {
    ts: nowStamp(),
    type,
    memo,
    inputPreview,
    outputPreview
  };

  const arr = getLogs();
  arr.unshift(entry);
  localStorage.setItem(LOG_KEY, JSON.stringify(arr));
  document.getElementById("historyInput").value = "";
  renderLogs(arr);
}

function getLogs(){
  try{
    const raw = localStorage.getItem(LOG_KEY);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){
    return [];
  }
}

function renderLogs(arr){
  const lines = [];
  for (const it of arr){
    lines.push(`[${it.ts}] ${it.type}`);
    if (it.memo) lines.push(`- 메모: ${it.memo}`);
    if (it.inputPreview) lines.push(`- 입력: ${it.inputPreview}${it.inputPreview.length>=120 ? "…" : ""}`);
    if (it.outputPreview) lines.push(`- 결과: ${it.outputPreview}${it.outputPreview.length>=120 ? "…" : ""}`);
    lines.push("");
  }
  document.getElementById("historyView").textContent = lines.join("\n").trim();
}

function loadLogs(){
  renderLogs(getLogs());
}

function clearLogs(){
  localStorage.removeItem(LOG_KEY);
  document.getElementById("historyView").textContent = "";
}

(function init(){
  loadLogs();
})();
</script>
</body>
</html>
