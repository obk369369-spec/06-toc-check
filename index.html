<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TOC Check</title>
<style>
body {
  font-family: Consolas, monospace;
  margin: 20px;
}

textarea {
  width: 100%;
  height: 200px;
  font-family: Consolas, monospace;
}

button {
  margin-top: 10px;
  margin-right: 5px;
  padding: 8px 14px;
}

.result-box {
  margin-top: 20px;
  border: 1px solid #ccc;
  padding: 10px;

  /* 🔥 여백 제거 핵심 */
  white-space: pre;
  font-family: Consolas, monospace;
  line-height: 1.4;
}

.result-box pre {
  margin: 0;
  padding: 0;
  text-indent: 0;
}

.result-box div {
  margin: 0;
  padding: 0;
  text-indent: 0;
}
</style>
</head>

<body>

<h2>6번 도구: TOC Check (C021 고정)</h2>
<p>규칙: 상위(예: 1) + 하위(예: 1.1)만 남김 / 그 외 제거 / 하위는 들여쓰기</p>

<textarea id="inputText"></textarea><br>

<button onclick="run()">분류 실행</button>
<button onclick="resetText()">초기화</button>

<h3>결과</h3>
<div class="result-box">
  <pre id="outputText"></pre>
</div>

<script>
function run() {
  const input = document.getElementById("inputText").value;
  const lines = input.split("\n");
  let result = [];

  for (let line of lines) {
    let trimmed = line.trim();
    if (!trimmed) continue;

    let match = trimmed.match(/^(\d+(\.\d+)?)/);
    if (!match) continue;

    let number = match[1];

    // 상위목차 (1,2,3)
    if (/^\d+$/.test(number)) {
      result.push(number + " " + trimmed.replace(/^\d+\s*/, ""));
    }
    // 하위목차 (1.1)
    else if (/^\d+\.\d+$/.test(number)) {
      result.push("  " + number + " " + trimmed.replace(/^\d+\.\d+\s*/, ""));
    }
    // 그 이상 제거
  }

  document.getElementById("outputText").textContent = result.join("\n");
}

function resetText() {
  document.getElementById("inputText").value = "";
  document.getElementById("outputText").textContent = "";
}
</script>

</body>
</html>
