<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>6번 도구: TOC Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  h1 { font-size: 18px; }
  textarea {
    width: 100%;
    min-height: 220px;
    font-family: monospace;
    margin-bottom: 8px;
  }
  button { padding: 8px 14px; margin-right: 6px; }
  .panel { border: 1px solid #ccc; padding: 12px; margin-top: 12px; }
  .output div { margin-left: 16px; line-height: 1.4; }
  .top { margin-left: 0; font-weight: bold; }
  .log { font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>6번 도구: TOC Check (C021 고정)</h1>

<div class="panel">
  <textarea id="input" placeholder="목차 원문 붙여넣기"></textarea>
  <button onclick="run()">분류 실행</button>
  <button onclick="clearAll()">초기화</button>
</div>

<div class="panel">
  <div id="output" class="output"></div>
</div>

<div class="panel">
  <button onclick="record('PASS')">PASS</button>
  <button onclick="record('X')">X</button>
</div>

<div class="panel">
  <div id="history" class="log"></div>
</div>

<script>
const KEY = "toc_check_history";

/* =========================
   규칙:
   - Chapter / SECTION 유지
   - 1, 2, 3 유지
   - 1.1, 2.1 유지
   - 1.1.1 이하 전부 제거
========================= */
function run() {
  const text = document.getElementById("input").value;
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const out = document.getElementById("output");
  out.innerHTML = "";

  lines.forEach(line => {

    // CHAPTER / SECTION 유지
    if (/^(chapter|section|CHAPTER|SECTION)\s+\w+/i.test(line)) {
      add(line, "top");
      return;
    }

    // 1 / 2 / 3 상위 유지
    if (/^\d+\b/.test(line) && !/\./.test(line)) {
      add(line, "top");
      return;
    }

    // 1.1 / 2.1 하위만 유지
    if (/^\d+\.\d+\b/.test(line)) {
      add(line);
      return;
    }

    // 그 아래 단계는 전부 제거
  });

  function add(txt, cls) {
    const d = document.createElement("div");
    d.textContent = txt;
    if (cls) d.className = cls;
    out.appendChild(d);
  }
}

function record(result) {
  const logs = JSON.parse(localStorage.getItem(KEY) || "[]");
  logs.push({ time: new Date().toLocaleString(), result });
  localStorage.setItem(KEY, JSON.stringify(logs));
  renderHistory();
}

function renderHistory() {
  const logs = JSON.parse(localStorage.getItem(KEY) || "[]");
  document.getElementById("history").textContent =
    logs.map(l => `[${l.time}] C021 ${l.result}`).join("\n");
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").innerHTML = "";
}

renderHistory();
</script>

</body>
</html>
