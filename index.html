<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TOC 정리 (vNext)</title>
  <style>
    :root { --b:#d0d7de; --bg:#fff; --fg:#111; --muted:#666; --btn:#f6f8fa; }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;color:var(--fg);background:var(--bg);}
    .wrap{max-width:1200px;margin:0 auto;padding:14px;}
    .topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .badge{font-size:12px;color:var(--muted);border:1px solid var(--b);padding:4px 8px;border-radius:999px;background:#fff;}
    .btn{border:1px solid var(--b);background:var(--btn);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
    .btn:active{transform:translateY(1px)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    .card{border:1px solid var(--b);border-radius:12px;padding:10px;background:#fff}
    .card h3{margin:0 0 8px 0;font-size:14px}
    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
    textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--b);border-radius:10px;padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:13px;line-height:1.35}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .hr{height:1px;background:var(--b);margin:12px 0}
    .history{white-space:pre-wrap;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:12px;line-height:1.35;max-height:360px;overflow:auto;border:1px solid var(--b);border-radius:10px;padding:10px;background:#fff}
    .right{display:flex;gap:8px;align-items:center}
    .tiny{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="btn" id="btnRun">정리</button>
      <button class="btn" id="btnClearIn">입력 지우기</button>
      <button class="btn" id="btnClearOut">출력 지우기</button>
      <button class="btn" id="btnCopyOut">출력 복사</button>
      <span class="badge" id="badgeState">Residual State: 0</span>
      <span class="badge" id="badgeAuto">Auto Reset: -</span>
      <span class="badge" id="badgeStorage">storage-read: OFF / storage-write: OFF</span>
      <span class="badge" id="badgeMsg">OK</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="row">
          <h3>입력 (원문 TOC)</h3>
          <div class="right">
            <button class="btn" id="btnTopIn">▲ 위로</button>
          </div>
        </div>
        <textarea id="in" placeholder="여기에 목차를 붙여넣기"></textarea>
      </div>

      <div class="card">
        <div class="row">
          <h3>출력 (정리 결과)</h3>
          <div class="right">
            <button class="btn" id="btnTopOut">▲ 위로</button>
          </div>
        </div>
        <textarea id="out" readonly placeholder="정리 결과"></textarea>
      </div>
    </div>

    <div class="hr"></div>

    <div class="card">
      <div class="row">
        <h3>이력 (화면에만 유지 · 저장소 사용 X)</h3>
        <span class="tiny">PASS/X + 날짜 + 원문/결과(일부) + 오류 메모</span>
      </div>
      <div class="actions" style="margin-bottom:8px">
        <button class="btn" id="btnPass">PASS</button>
        <button class="btn" id="btnFail">X</button>
        <button class="btn" id="btnClearHist">이력 화면만 지우기</button>
      </div>
      <div id="hist" class="history"></div>
    </div>
  </div>

<script>
(() => {
  // ✅ 원천 차단: localStorage/sessionStorage/IndexedDB 읽기/쓰기 사용하지 않음.
  // (브라우저/확장프로그램 자체는 별개)

  const $ = (id) => document.getElementById(id);

  const taIn  = $("in");
  const taOut = $("out");
  const hist  = $("hist");

  const badgeState   = $("badgeState");
  const badgeAuto    = $("badgeAuto");
  const badgeMsg     = $("badgeMsg");

  let residual = 0;

  function nowStamp() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function setMsg(msg) {
    badgeMsg.textContent = msg;
  }

  function hardResetEphemeral() {
    // ✅ "자동 리셋": 저장소는 애초에 안 쓰고, 잔여 상태/메시지 등만 초기화
    residual = 0;
    badgeState.textContent = `Residual State: ${residual}`;
    badgeAuto.textContent = `Auto Reset: ${nowStamp()}`;
    setMsg("OK");
  }

  function safeScrollTop(ta) {
    // ✅ 클릭은 됐는데 스크롤이 안 먹는 현상 방지: rAF + focus + selection
    requestAnimationFrame(() => {
      try {
        ta.focus({preventScroll:true});
      } catch(e) {}
      ta.scrollTop = 0;
      try {
        ta.setSelectionRange(0, 0);
      } catch(e) {}
    });
  }

  function normalizeLines(s) {
    return (s || "")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n");
  }

  function isAllCapsWord(line) {
    // INTRODUCTION 같은 "대문자 제목" 처리용 (숫자/기호 섞여도 허용)
    const t = line.trim();
    if (!t) return false;
    const hasLetter = /[A-Za-z]/.test(t);
    const mostlyCaps = /^[A-Z0-9 .,&()\-\/]+$/.test(t);
    return hasLetter && mostlyCaps;
  }

  function parseToC(input) {
    // 목표: 붙여넣은 원문에서 "목차로 보이는 라인"만 적당히 추출/정렬
    // ✅ 저장소/이력/과거 데이터 영향을 0으로: input 문자열만 사용
    const raw = normalizeLines(input).split("\n");

    const out = [];
    for (let line of raw) {
      const t = line.trim();
      if (!t) continue;

      // 페이지번호만 있는 줄 제거 (예: "28", "54")
      if (/^\d{1,4}$/.test(t)) continue;

      // FIGURE / TABLE 같은 라인들 제거(필요시 조정)
      if (/^(FIGURE|TABLE)\b/i.test(t)) continue;

      // "5.2.1" 같은 숫자만 남는 줄 제거
      if (/^\d+(\.\d+)*\.?$/.test(t)) continue;

      // 들여쓰기 기반 구조는 유지하되 최소화: 선행 공백 0~6만
      const lead = (line.match(/^\s+/)?.[0] || "").length;
      const indent = " ".repeat(Math.min(6, lead));

      // 숫자+제목(예: 5.2 MARKET DYNAMICS)
      // 또는 대문자 제목(예: INTRODUCTION)
      if (/^\d+(\.\d+)*\s+.+/.test(t) || isAllCapsWord(t)) {
        out.push(indent + t.replace(/\s{2,}/g, " "));
        continue;
      }

      // 그 외는 제목 후보로 간주하되 너무 긴 문장은 제외
      if (t.length <= 80) out.push(indent + t);
    }

    // 중복 제거(순서 유지)
    const seen = new Set();
    const uniq = [];
    for (const l of out) {
      const key = l.trim().toLowerCase(); // ✅ 대소문자 판단으로 오류 나던 패턴 방지: 비교만 소문자
      if (seen.has(key)) continue;
      seen.add(key);
      uniq.push(l);
    }

    return uniq.join("\n");
  }

  function run() {
    try {
      hardResetEphemeral(); // ✅ 매 실행 때 잔여 상태 초기화(사용 번거로움 감소)
      const input = taIn.value || "";
      const result = parseToC(input);
      taOut.value = result;

      // 실행 후 출력 상단으로(원하면 제거 가능)
      safeScrollTop(taOut);

      setMsg("DONE");
    } catch (e) {
      residual++;
      badgeState.textContent = `Residual State: ${residual}`;
      setMsg("ERROR: " + (e?.message || String(e)));
    }
  }

  function addHistory(mark, memo="") {
    const ts = nowStamp();
    const inSample  = normalizeLines(taIn.value).split("\n").slice(0, 40).join("\n");
    const outSample = normalizeLines(taOut.value).split("\n").slice(0, 40).join("\n");

    const block =
`[${ts}]  ${mark}
- 메모: ${memo || "(없음)"}
- 원문(일부):
${inSample || "(비어있음)"}
- 결과(일부):
${outSample || "(비어있음)"}
----------------------------------------\n`;

    hist.textContent = block + hist.textContent; // 최신을 위로
    hist.scrollTop = 0;
  }

  async function copyOut() {
    const text = taOut.value || "";
    if (!text) { setMsg("복사할 출력이 없음"); return; }

    try {
      await navigator.clipboard.writeText(text);
      setMsg("복사 완료");
    } catch (e) {
      // 일부 환경에서는 권한/https 이슈 → fallback
      try {
        taOut.focus();
        taOut.select();
        document.execCommand("copy");
        taOut.setSelectionRange(0,0);
        setMsg("복사 완료(대체)");
      } catch (e2) {
        setMsg("복사 실패");
      }
    }
  }

  // 버튼 바인딩
  $("btnRun").addEventListener("click", run);

  $("btnTopIn").addEventListener("click", () => safeScrollTop(taIn));
  $("btnTopOut").addEventListener("click", () => safeScrollTop(taOut));

  $("btnClearIn").addEventListener("click", () => { taIn.value = ""; safeScrollTop(taIn); setMsg("입력 지움"); });
  $("btnClearOut").addEventListener("click", () => { taOut.value = ""; safeScrollTop(taOut); setMsg("출력 지움"); });

  $("btnCopyOut").addEventListener("click", copyOut);

  $("btnPass").addEventListener("click", () => addHistory("PASS"));
  $("btnFail").addEventListener("click", () => addHistory("X", "오류/누락/형태 이상"));

  $("btnClearHist").addEventListener("click", () => { hist.textContent = ""; setMsg("이력 화면만 지움"); });

  // 초기 자동 리셋 표시
  hardResetEphemeral();
})();
</script>
</body>
</html>
