<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>6번 도구: TOC Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
body { font-family: system-ui, sans-serif; margin: 16px; }
h1 { font-size: 18px; }
textarea {
  width: 100%;
  min-height: 220px;
  font-family: monospace;
  margin-bottom: 8px;
}
button { padding: 8px 14px; margin-right: 6px; }
.panel { border: 1px solid #ccc; padding: 12px; margin-top: 12px; }
.output div { margin-left: 16px; }
.top { margin-left: 0; font-weight: bold; }
.log { font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>6번 도구: TOC Check (C021 고정)</h1>

<div class="panel">
<textarea id="input" placeholder="목차 원문 붙여넣기"></textarea>
<button onclick="run()">분류 실행</button>
<button onclick="clearAll()">초기화</button>
</div>

<div class="panel">
<strong>출력</strong>
<div id="output" class="output"></div>
</div>

<div class="panel">
<button onclick="record('PASS')">PASS</button>
<button onclick="record('X')">X</button>
</div>

<div class="panel">
<strong>이력</strong>
<div id="history" class="log"></div>
</div>

<script>
const KEY = "toc_check_history_v3";

/* ---------- 핵심 로직 ---------- */
function run() {
  const text = document.getElementById("input").value;
  const rawLines = text.split(/\r?\n/);

  const out = document.getElementById("output");
  out.innerHTML = "";

  rawLines.forEach(line => {
    const clean = line.replace(/\s+/g," ").trim();
    if (!clean) return;

    // 페이지 번호 제거 (숫자 단독 줄)
    if (/^\d{1,3}$/.test(clean)) return;

    // Chapter 인식
    if (/^(Chapter|CHAPTER)\s+\d+/i.test(clean)) {
      const div = document.createElement("div");
      div.textContent = clean;
      div.className = "top";
      out.appendChild(div);
      return;
    }

    // 숫자 계층 + 제목 있는 줄만 허용
    if (/^\d+(\.\d+)*\s+[A-Za-z]/.test(clean)) {
      const div = document.createElement("div");
      div.textContent = clean;
      out.appendChild(div);
      return;
    }

    // 숫자만 있는 줄은 무시
    if (/^\d+(\.\d+)*$/.test(clean)) return;
  });
}

/* ---------- 기록 ---------- */
function record(result) {
  const logs = JSON.parse(localStorage.getItem(KEY) || "[]");
  logs.push({
    time: new Date().toLocaleString(),
    result
  });
  localStorage.setItem(KEY, JSON.stringify(logs));
  renderHistory();
}

function renderHistory() {
  const logs = JSON.parse(localStorage.getItem(KEY) || "[]");
  document.getElementById("history").textContent =
    logs.map(l => `[${l.time}] C021 ${l.result}`).join("\n");
}

/* ---------- 초기화 ---------- */
function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("output").innerHTML = "";
}

renderHistory();
</script>

</body>
</html>
